plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cutequran.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.cutequran.app"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        noCompress 'txt'
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.version', 'DebugProbesKt.bin', 'kotlin-tooling-metadata.json']
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Redundant timer: survives the force-stops that wipe our alarms on some ROMs.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
